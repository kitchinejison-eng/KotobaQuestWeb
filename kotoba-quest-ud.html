<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>ことばファンタジーDX - SIDE VIEW RPG -</title>
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background-color: #0d0f12;
    color: #ffffff;
    font-family: 'BIZ UDPGothic', 'Hiragino Sans', 'Meiryo', 'Yu Gothic UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 12px;
    line-height: 1.6;
  }

  /* ゲーム全体コンテナ (高コントラスト・UDフレーム) */
  #game-container {
    width: 100%;
    max-width: 760px;
    background-color: #000000;
    border: 5px solid #ffffff;
    border-radius: 12px;
    box-shadow: 0 0 24px rgba(255, 255, 255, 0.25);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* コントロールヘッダー（音声読み上げ設定など） */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    background: #1a1d24;
    padding: 8px 12px;
    border-radius: 8px;
    border: 2px solid #555;
  }

  .top-title {
    font-size: 18px;
    font-weight: bold;
    color: #ffeb3b;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .toggle-btn {
    min-height: 48px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    background: #2a2f3a;
    color: #fff;
    border: 2px solid #aaa;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .toggle-btn:hover, .toggle-btn:focus {
    background: #3b4252;
    border-color: #ffeb3b;
    outline: none;
  }

  .toggle-btn.active {
    background: #1b4d3e;
    border-color: #00ffcc;
    color: #00ffcc;
  }

  /* DQ風ウィンドウ共通スタイル */
  .ud-box {
    background-color: #000000;
    border: 4px solid #ffffff;
    border-radius: 8px;
    padding: 14px;
    position: relative;
  }

  /* バトルキャンバス (サイドビュー表示) */
  .canvas-container {
    width: 100%;
    position: relative;
    background-color: #0a0d18;
    border: 4px solid #ffffff;
    border-radius: 8px;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
  }

  /* ステータス ＆ メッセージ表示 */
  .status-message-grid {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 12px;
  }

  @media (max-width: 580px) {
    .status-message-grid {
      grid-template-columns: 1fr;
    }
  }

  .status-box {
    font-size: 16px;
    font-weight: bold;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .hp-bar-outer {
    width: 100%;
    height: 14px;
    background-color: #333;
    border: 2px solid #fff;
    border-radius: 7px;
    overflow: hidden;
    margin-top: 2px;
    margin-bottom: 8px;
  }

  .hp-bar-inner {
    height: 100%;
    width: 100%;
    background-color: #00ff66;
    transition: width 0.3s ease, background-color 0.3s ease;
  }

  .message-box {
    font-size: 18px;
    font-weight: bold;
    min-height: 90px;
    display: flex;
    align-items: center;
    color: #ffffff;
    line-height: 1.7;
  }

  /* ルビ（ふりがな）の視認性調整 */
  ruby {
    ruby-align: center;
  }

  rt {
    font-size: 0.6em;
    color: #ffeb3b;
    font-weight: bold;
    line-height: 1.1;
  }

  /* クイズエリア */
  .quiz-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background-color: #05070a;
  }

  .quiz-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid #333;
    padding-bottom: 8px;
  }

  .quiz-tag {
    color: #ffeb3b;
    font-size: 16px;
    font-weight: bold;
  }

  /* 音声・ヒントアクションボタン */
  .action-btn {
    min-height: 48px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    background-color: #1e2838;
    color: #ffffff;
    border: 2px solid #6688bb;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 15px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  .action-btn:hover, .action-btn:focus {
    background-color: #2c3e55;
    border-color: #ffeb3b;
    color: #ffeb3b;
    outline: none;
    transform: translateY(-1px);
  }

  .action-btn:active {
    transform: translateY(1px);
  }

  .quiz-question-card {
    background-color: #111622;
    border: 3px solid #ffeb3b;
    border-radius: 8px;
    padding: 14px;
    font-size: 21px;
    font-weight: bold;
    line-height: 1.8;
    min-height: 70px;
  }

  /* ヒント表示ボックス */
  .hint-box {
    display: none;
    background-color: #2b2200;
    border: 2px solid #ffcc00;
    color: #fff8d6;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 16px;
    font-weight: bold;
    line-height: 1.6;
  }

  /* 選択肢ボタンエリア（図形＋色＋ルビ） */
  .options-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 580px) {
    .options-container {
      grid-template-columns: 1fr;
    }
  }

  .btn-option {
    background-color: #12151c;
    color: #ffffff;
    border: 3px solid #ffffff;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 20px;
    font-weight: bold;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    transition: all 0.15s ease;
  }

  .btn-option:hover:not(:disabled), .btn-option:focus:not(:disabled) {
    background-color: #252d3d;
    border-color: #ffeb3b;
    box-shadow: 0 0 12px rgba(255, 235, 59, 0.4);
    outline: none;
  }

  .btn-option:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* 視覚補助用シンボルバッジ (🔴, 🔵, 🟡, 🟢) */
  .shape-badge {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 42px;
    height: 42px;
    border-radius: 8px;
    font-size: 20px;
    font-weight: bold;
    flex-shrink: 0;
    color: #000;
  }

  .badge-red { background-color: #ff4d4d; color: #fff; }
  .badge-blue { background-color: #3399ff; color: #fff; }
  .badge-yellow { background-color: #ffcc00; color: #000; }
  .badge-green { background-color: #22cc66; color: #fff; }

  /* スタート・結果オーバーレイ */
  .overlay {
    /* スタート／結果画面はキャンバス内ではなくブラウザの表示領域全体で表示します。 */
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: radial-gradient(ellipse at 50% 30%, rgba(25,54,83,.97), rgba(0,0,0,.98) 72%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: clamp(14px, 3vh, 24px);
    padding: max(22px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    text-align: center;
    z-index: 600;
    overscroll-behavior: contain;
  }

  .overlay-title {
    width: 100%;
    max-width: 620px;
    font-size: clamp(26px, 6.5vw, 36px);
    font-weight: bold;
    color: #ffeb3b;
    text-shadow: 3px 3px 0 #cc0000;
  }

  .overlay-desc {
    width: 100%;
    font-size: clamp(17px, 4.4vw, 20px);
    color: #dddddd;
    max-width: 480px;
    line-height: 1.7;
  }

  .big-start-btn {
    width: 100%;
    min-height: 76px;
    max-width: 500px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #087fca;
    color: #ffffff;
    border: 4px solid #ffffff;
    padding: 18px 22px;
    font-size: clamp(21px, 5.2vw, 26px);
    line-height: 1.45;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    border-radius: 12px;
    box-shadow: 0 6px 0 #005588;
    transition: transform 0.1s ease, background-color 0.1s ease, box-shadow 0.1s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .big-start-btn:hover, .big-start-btn:focus {
    background: #00aaff;
    transform: translateY(-2px);
    box-shadow: 0 8px 0 #005588;
    outline: none;
  }

  .big-start-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #005588;
  }


  /* ============================================================
     追加：会話イベント＋縦横対応
     ============================================================ */
  .event-overlay {
    /* PC・タブレット・スマートフォンの表示領域に合わせます。 */
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 500;
    align-items: stretch;
    justify-content: stretch;
    background: #000;
    overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .event-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.18)), url('images/ivent/back_1.jpg?v=69') center/cover no-repeat;
    animation: eventBgMove 14s ease-in-out infinite alternate;
    transform: scale(1.04);
  }
  @keyframes eventBgMove {
    0% { transform: scale(1.04) translate3d(0,0,0); }
    100% { transform: scale(1.08) translate3d(-1.5%, -1%, 0); }
  }
  .event-character {
    position: absolute;
    left: 50%;
    bottom: clamp(180px, 25vh, 235px);
    width: min(68vw, 430px);
    height: min(58vh, 500px);
    max-height: none;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,.45));
    animation: eventCharacterFloat 2.8s ease-in-out infinite;
  }
  .event-character.rare-event { filter: drop-shadow(0 0 18px rgba(255,218,87,.95)) drop-shadow(0 0 34px rgba(255,165,0,.65)); animation: eventCharacterFloat 2.8s ease-in-out infinite, rareCharacterPulse 1.1s ease-in-out 3; }
  .event-character.rare-event::after { content:"✨ レア登場！ ✨"; position:absolute; top:-8%; left:50%; transform:translateX(-50%); white-space:nowrap; padding:6px 13px; border-radius:999px; color:#382300; background:linear-gradient(90deg,#ffe789,#fff7cd,#ffc84d); border:2px solid #fff3b2; font-size:clamp(13px,2vw,20px); font-weight:900; box-shadow:0 0 20px rgba(255,210,70,.8); animation:rareLabelPop .65s ease-out both; }
  @keyframes rareCharacterPulse { 0%,100% { filter:drop-shadow(0 0 10px rgba(255,218,87,.6)); } 50% { filter:drop-shadow(0 0 28px rgba(255,218,87,1)) drop-shadow(0 0 44px rgba(255,165,0,.8)); } }
  @keyframes rareLabelPop { 0% {opacity:0; transform:translateX(-50%) scale(.45) translateY(12px);} 75% {opacity:1; transform:translateX(-50%) scale(1.08);} 100% {opacity:1; transform:translateX(-50%) scale(1);} }
  @keyframes eventCharacterFloat {
    0%,100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -6px); }
  }
  .event-character img {
    display: block;
    width: auto;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    object-position: center bottom;
  }
  .event-dialog {
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: 4%;
    min-height: 25%;
    background: rgba(0,0,0,.92);
    border: 4px solid #fff;
    border-radius: 12px;
    box-shadow: 0 0 0 3px rgba(0,0,0,.65), 0 8px 22px rgba(0,0,0,.4);
    padding: 15px 18px 16px;
    z-index: 2;
  }
  .event-dialog-name {
    display: inline-block;
    margin: -30px 0 6px;
    padding: 4px 14px;
    background: #0b4d7a;
    color: #fff;
    border: 3px solid #fff;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 900;
  }
  .event-dialog-text {
    min-height: 58px;
    color: #fff;
    font-size: clamp(16px, 3.2vw, 22px);
    font-weight: 900;
    line-height: 1.7;
    white-space: pre-wrap;
    padding-right: 48px;
  }
  .event-dialog-replay {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-top: 5px;
    min-height: 42px;
    padding: 8px 13px;
    border: 2px solid rgba(255,255,255,.95);
    border-radius: 9px;
    background: #087cae;
    color: #fff;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 3px 0 #044c72;
  }
  .event-dialog-replay:focus-visible { outline: 4px solid #ffdf58; outline-offset: 2px; }
  .event-dialog-replay:active { transform: translateY(2px); box-shadow: 0 1px 0 #044c72; }
  .event-dialog-next {
    position: absolute;
    right: 14px;
    bottom: 10px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 3px solid #fff;
    background: #0088cc;
    color: #fff;
    font-size: 23px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 0 #005588;
  }
  .event-dialog-next:active { transform: translateY(3px); box-shadow: 0 1px 0 #005588; }

  .overlay-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    width: 100%;
    max-width: 520px;
  }
  .overlay-secondary-btn {
    background: #1a1d24;
    color: #fff;
    border: 3px solid #fff;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
  }
  .overlay-secondary-btn:active { transform: translateY(2px); }


  @media (orientation: landscape) and (max-height: 520px) {
    .overlay { justify-content: flex-start; gap: 10px; padding-top: 14px; padding-bottom: 14px; }
    .overlay-title { font-size: clamp(22px, 4vw, 30px); }
    .overlay-desc { font-size: 16px; line-height: 1.45; }
    .big-start-btn { min-height: 64px; padding: 12px 18px; }
    .event-character { bottom: 132px; height: min(60vh, 250px); width: min(34vw, 300px); }
  }

  @media (orientation: landscape) and (min-width: 700px) {
    body { padding: 8px; }
    #game-container { max-width: 1100px; gap: 10px; padding: 10px; }
    .canvas-container canvas { max-height: 46vh; }
    .event-character { left: 50%; width: min(34vw, 340px); height: min(62vh, 280px); bottom: 145px; }
    .event-dialog { left: 3%; right: 3%; bottom: 3%; min-height: 23%; }
    .event-dialog-text { font-size: clamp(15px, 2.1vw, 21px); }
    .status-message-grid { grid-template-columns: 220px 1fr; }
    .options-container { grid-template-columns: repeat(4, 1fr); }
  }

  @media (orientation: portrait) and (max-width: 699px) {
    .event-character { left: 50%; width: min(66vw, 390px); height: min(58vh, 470px); bottom: clamp(190px, 27vh, 235px); }
    .event-dialog { min-height: 29%; }
    .event-dialog-text { font-size: 17px; padding-right: 8px; }
    .event-dialog-replay { font-size: 14px; min-height: 40px; padding: 7px 10px; }
    .overlay { justify-content: center; gap: 14px; }
    .overlay-desc { max-width: 440px; line-height: 1.6; }
    .overlay-actions { max-width: 440px; }
    .big-start-btn { min-height: 80px; }
    .overlay-secondary-btn { min-height: 54px; width: 100%; }
    .options-container { grid-template-columns: 1fr 1fr; }
  }

</style>

</head>
<body>

<div id="game-container">
  <!-- 上部コントロールバー -->
  <div class="top-bar">
    <div class="top-title">
      <button id="btn-back-main" class="toggle-btn" type="button" title="ことばクエスト本体へ戻る" style="margin-right: 6px;">← 戻る</button>
      <span>⚔️</span>
      <span>ことばファンタジーDX</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <button id="btn-auto-speech" class="toggle-btn active" title="自動で問題を読み上げます">
        🔊 <ruby>自動<rt>じどう</rt></ruby>よみあげ: ON
      </button>
    </div>
  </div>

  <!-- サイドビュー戦闘キャンバス -->
  <div class="canvas-container">
    <canvas id="battleCanvas" width="600" height="230"></canvas>
  </div>

  <!-- 画面全体に重ねる会話イベント。canvasのoverflowに切られません。 -->
    <!-- ことばクエスト会話イベント（ねこまる） -->
    <div id="eventOverlay" class="event-overlay" aria-live="polite">
      <div class="event-bg"></div>
      <div class="event-character">
        <img id="eventCharacterImage" src="images/ivent/cat_1_crop.png?v=69" alt="ねこまる">
      </div>
      <div class="event-dialog">
        <div id="eventName" class="event-dialog-name">ねこまる</div>
        <div id="eventText" class="event-dialog-text"></div>
        <button id="eventReplayBtn" class="event-dialog-replay" type="button" aria-label="セリフをもう一度聞く">🔊 もう一度聞く</button>
        <button id="eventNextBtn" class="event-dialog-next" type="button" aria-label="次へ">▼</button>
      </div>
    </div>
    
    <!-- スタート / ゲームオーバー画面 -->
    <div id="overlay" class="overlay">
      <div id="overlay-title" class="overlay-title">ことばファンタジーDX</div>
      <div id="overlay-desc" class="overlay-desc">
        <ruby>言葉<rt>ことば</rt></ruby>の クイズに こたえて<br>
        モンスターを たおそう！<br>
        <span style="color: #ffeb3b; font-size: 16px; margin-top: 8px; display: block;">
          ※ こえでの 読み上げ機能（きのう）が ついています。
        </span>
      </div>
      <div class="overlay-actions">
        <button id="start-btn" class="big-start-btn">冒険（ぼうけん）を はじめる</button>
        <button id="record-btn" class="overlay-secondary-btn" type="button" style="display:none;">📊 トレーニングの記録を見る</button>
      </div>
    </div>

  <!-- ステータス ＆ メッセージ表示 -->
  <div class="status-message-grid">
    <div class="ud-box status-box">
      <div class="status-row">
        <span><ruby>勇者<rt>ゆうしゃ</rt></ruby></span>
        <span>Lv.<span id="hero-lv">1</span></span>
      </div>
      <div class="status-row">
        <span>HP</span>
        <span><span id="hero-hp">100</span>/<span id="hero-maxhp">100</span></span>
      </div>
      <div class="hp-bar-outer">
        <div id="hero-hp-bar" class="hp-bar-inner"></div>
      </div>

      <hr style="border: 1px solid #333; margin: 8px 0;">

      <div class="status-row">
        <span id="enemy-name" style="color: #ff9999;"><ruby>敵<rt>てき</rt></ruby></span>
      </div>
      <div class="hp-bar-outer">
        <div id="enemy-hp-bar" class="hp-bar-inner" style="background-color: #ff4d4d;"></div>
      </div>
    </div>

    <div class="ud-box message-box">
      <div id="message-text">モンスターが あらわれた！</div>
    </div>
  </div>

  <!-- クイズ / コマンドエリア -->
  <div class="ud-box quiz-section">
    <div class="quiz-top-row">
      <div class="quiz-tag" id="quiz-tag">【ことばの クイズ】</div>
      <div style="display: flex; gap: 8px;">
        <button id="btn-read-question" class="action-btn">
          🔊 <ruby>音声<rt>おんせい</rt></ruby>で きく
        </button>
        <button id="btn-show-hint" class="action-btn" style="border-color: #ffcc00;">
          💡 ひんと
        </button>
      </div>
    </div>

    <!-- 問題文 -->
    <div class="quiz-question-card" id="quiz-question">
      準備中（じゅんびちゅう）...
    </div>

    <!-- ヒント領域 -->
    <div id="hint-box" class="hint-box">
      💡 ヒントが ここに 表示（ひょうじ）されます。
    </div>

    <!-- 選択肢ボタン（4択） -->
    <div class="options-container" id="options-container">

// ==========================================
// 1. Web Audio API レトロサウンド効果音
// ==========================================
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
  }
}

function playSE(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  if (type === 'click') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(800, now);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.05);
    osc.start(now); osc.stop(now + 0.05);
  } 
  else if (type === 'attack') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(450, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  }
  else if (type === 'correct') {
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + idx * 0.08);
      gain.gain.setValueAtTime(0.2, now + idx * 0.08);
      gain.gain.linearRampToValueAtTime(0, now + idx * 0.08 + 0.15);
      osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.15);
    });
  }
  else if (type === 'wrong') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.setValueAtTime(110, now + 0.15);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.3);
    osc.start(now); osc.stop(now + 0.3);
  }
  else if (type === 'hint') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, now);
    osc.frequency.setValueAtTime(880, now + 0.1);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);
  }
  else if (type === 'fanfare') {
    const notes = [523.25, 523.25, 523.25, 659.25, 783.99, 1046.50];
    const times = [0, 0.1, 0.2, 0.3, 0.45, 0.6];
    const dur = [0.08, 0.08, 0.08, 0.12, 0.12, 0.4];
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + times[idx]);
      gain.gain.setValueAtTime(0.2, now + times[idx]);
      gain.gain.linearRampToValueAtTime(0, now + times[idx] + dur[idx]);
      osc.start(now + times[idx]); osc.stop(now + times[idx] + dur[idx]);
    });
  }
}

// ==========================================
// 2. 音声読み上げ機能（Web Speech API）
// ==========================================
let autoSpeechEnabled = true;
let speechRequestToken = 0;

function chooseJapaneseVoice(voices) {
  const jp = (voices || []).filter(v => /^ja([_-]|$)/i.test(v.lang || ''));
  if (!jp.length) return null;
  return jp.find(v => /natural|neural|premium|online/i.test(v.name || ''))
      || jp.find(v => /google|microsoft/i.test(v.name || ''))
      || jp[0];
}

function speakText(text, onEndCallback = null) {
  if (!text) return false;
  if (window.AndroidSpeech && typeof window.AndroidSpeech.speak === 'function') {
    try {
      window.AndroidSpeech.speak(String(text).replace(/\s+/g, ' ').trim());
      if (typeof onEndCallback === 'function') window.setTimeout(onEndCallback, Math.min(12000, Math.max(900, String(text).length * 95)));
      return true;
    } catch (e) {}
  }
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') return false;
  const token = ++speechRequestToken;
  try { window.speechSynthesis.cancel(); } catch (e) {}
  const startSpeech = () => {
    if (token !== speechRequestToken || document.hidden) return;
    try {
      const utterance = new SpeechSynthesisUtterance(String(text).replace(/\s+/g, ' ').trim());
      utterance.lang = 'ja-JP';
      utterance.rate = 0.86;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;
      const voice = chooseJapaneseVoice(window.speechSynthesis.getVoices());
      if (voice) utterance.voice = voice;
      if (onEndCallback) utterance.onend = () => { if (token === speechRequestToken) onEndCallback(); };
      window.speechSynthesis.speak(utterance);
    } catch (e) { console.warn('読み上げを開始できませんでした', e); }
  };
  // 一部ブラウザでは日本語音声一覧の読み込みに少し時間がかかります。
  if (window.speechSynthesis.getVoices().length) startSpeech();
  else window.setTimeout(startSpeech, 220);
  return true;
}

function stopSpeech() {
  speechRequestToken++;
  try { if (window.AndroidSpeech && typeof window.AndroidSpeech.stopTts === 'function') window.AndroidSpeech.stopTts(); } catch (e) {}
  if ('speechSynthesis' in window) {
    try { speechSynthesis.cancel(); } catch (e) {}
  }
}

function returnToKotobaQuest() {
  stopSpeech();
  if (window.AndroidApp && typeof window.AndroidApp.returnToMain === 'function') {
    try { window.AndroidApp.returnToMain(); return; } catch (e) {}
  }
  window.location.href = 'index.html#title';
}

function drawPixelArt(pixels, palette, startX, startY, pixelSize = 5) {
  for (let r = 0; r < pixels.length; r++) {
    for (let c = 0; c < pixels[r].length; c++) {
      const char = pixels[r][c];
      if (char !== '.' && palette[char]) {
        ctx.fillStyle = palette[char];
        ctx.fillRect(startX + c * pixelSize, startY + r * pixelSize, pixelSize, pixelSize);
      }
    }
  }
}

    drawPixelArt(pData, pColor, eX, eY, 6);

  if (slashEffect) {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(enemyX - 10, enemyY - 10);
    ctx.lineTo(enemyX + 90, enemyY + 90);
    ctx.stroke();
  }

  // ダメージ数値ポップアップ
  for (let i = damageTexts.length - 1; i >= 0; i--) {
    let dt = damageTexts[i];
    ctx.font = 'bold 26px sans-serif';
    ctx.fillStyle = dt.color;
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4;
    ctx.strokeText(dt.text, dt.x, dt.y);
    ctx.fillText(dt.text, dt.x, dt.y);
    dt.y -= 1;
    dt.alpha -= 0.02;
    if (dt.alpha <= 0) damageTexts.splice(i, 1);
  }

  if (heroShake > 0) heroShake *= 0.8;
  if (enemyShake > 0) enemyShake *= 0.8;

  requestAnimationFrame(render);
}

const KOTOBA_EVENT_BACKGROUNDS = ['back_1.jpg','back_2.jpg','back_3.jpg','back_4.jpg','back_5.jpg'];
function setRandomKotobaEventBackground(element){
  if(!element) return '';
  let previous = '';
  try { previous = window.sessionStorage.getItem('kotoba-last-event-bg') || ''; } catch(e) {}
  const options = KOTOBA_EVENT_BACKGROUNDS.filter(function(name){return name!==previous;});
  const selected = options[Math.floor(Math.random()*options.length)] || KOTOBA_EVENT_BACKGROUNDS[0];
  try{sessionStorage.setItem('kotoba-last-event-bg',selected);}catch(e){}
  element.style.backgroundImage = 'linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.18)), url("images/ivent/'+selected+'?v=69")';
  element.dataset.background = selected;
  return selected;
}
function chooseKotobaEventVisual(profile){
  const rare = Array.isArray(profile.rareImages) && profile.rareImages.length>0 && Math.random()<0.05;
  const source = rare ? profile.rareImages[Math.floor(Math.random()*profile.rareImages.length)] : profile.image;
  return {image:source, isRare:rare};
}
let activeEventCharacter = null;
let EVENT_STEPS = [];
function chooseEventLine(lines) { return lines[Math.floor(Math.random() * lines.length)]; }
function createRandomEventSteps(profile) {
  return [
    { name: profile.name, text: chooseEventLine(profile.greeting) },
    { name: profile.name, text: chooseEventLine(profile.welcome) },
    { name: profile.name, text: chooseEventLine(profile.advice) },
    { name: profile.name, text: chooseEventLine(profile.finish) }
  ];
}
let eventIndex = 0;
let eventTypingTimer = null;
let eventTypingToken = 0;
let gameActionTimers = [];

function clearGameActionTimers(){
  gameActionTimers.forEach(function(id){ clearTimeout(id); });
  gameActionTimers = [];
}

function scheduleGameAction(fn, ms){
  const id = setTimeout(function(){
    gameActionTimers = gameActionTimers.filter(function(x){ return x !== id; });
    try { fn(); } catch(e) { console.error('game action failed', e); safeRecoverFromGameError(e); }
  }, ms);
  gameActionTimers.push(id);
  return id;
}

function safeRecoverFromGameError(e){
  console.error(e);
  isProcessing = false;
  const btns = document.querySelectorAll('.btn-option');
  btns.forEach(function(b){ b.disabled = false; });
  const msg = document.getElementById('message-text');
  if(msg) msg.textContent = 'もう一度、答えを選んでください。';
}

function renderEventStep(){
  const overlay = document.getElementById('eventOverlay');
  const name = document.getElementById('eventName');
  const text = document.getElementById('eventText');
  const next = document.getElementById('eventNextBtn');
  if(!overlay || !text || !next) return;
  const step = EVENT_STEPS[eventIndex] || EVENT_STEPS[EVENT_STEPS.length - 1];
  overlay.style.display = 'flex';
  if (activeEventCharacter) {
    const characterImage = document.getElementById('eventCharacterImage');
    if (characterImage) {
      characterImage.onerror = function(){
        this.onerror = null;
        const profile = EVENT_CHARACTER_PROFILES.find(function(item){return item.name === activeEventCharacter.name;});
        if(profile && this.src !== profile.image) { this.src = profile.image; const wrap=this.closest('.event-character'); if(wrap) wrap.classList.remove('rare-event'); }
      };
      characterImage.src = activeEventCharacter.image;
      characterImage.alt = activeEventCharacter.name;
    }
  }
  if(name) name.textContent = step.name;
  if(eventTypingTimer) clearInterval(eventTypingTimer);
  const token = ++eventTypingToken;
  let i = 0;
  text.textContent = '';
  eventTypingTimer = setInterval(function(){
    if(token !== eventTypingToken){ clearInterval(eventTypingTimer); eventTypingTimer=null; return; }
    i++;
    text.textContent = step.text.slice(0, i);
    if(i >= step.text.length){ clearInterval(eventTypingTimer); eventTypingTimer=null; }
  }, 45);
  speakText(step.text);
  next.textContent = eventIndex >= EVENT_STEPS.length - 1 ? 'ゲームへ' : '▼';
}

function finishEvent(){
  if(eventTypingTimer){ clearInterval(eventTypingTimer); eventTypingTimer=null; }
  ++eventTypingToken;
  stopSpeech();
  const overlay = document.getElementById('eventOverlay');
  if(overlay) overlay.style.display = 'none';
  beginBattle();
}

function advanceEvent(){
  const text = document.getElementById('eventText');
  const step = EVENT_STEPS[eventIndex];
  if(text && step && text.textContent !== step.text){
    if(eventTypingTimer) clearInterval(eventTypingTimer);
    eventTypingTimer=null;
    ++eventTypingToken;
    text.textContent = step.text;
    speakText(step.text);
    return;
  }
  if(eventIndex < EVENT_STEPS.length - 1){
    eventIndex++;
    renderEventStep();
  }else{
    finishEvent();
  }
}

function startConversationEvent(){
  eventIndex = 0;
  const profile = EVENT_CHARACTER_PROFILES[Math.floor(Math.random() * EVENT_CHARACTER_PROFILES.length)];
  const visual = chooseKotobaEventVisual(profile);
  activeEventCharacter = Object.assign({}, profile, { image: visual.image, isRare: visual.isRare });
  const bg = document.querySelector('#eventOverlay .event-bg');
  setRandomKotobaEventBackground(bg);
  const characterWrap = document.querySelector('#eventOverlay .event-character');
  if(characterWrap) characterWrap.classList.toggle('rare-event', visual.isRare);
  EVENT_STEPS = createRandomEventSteps(activeEventCharacter);
  renderEventStep();
}

function beginBattle(){
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.style.display = 'none';
  spawnEnemy();
}

function initGame() {
  clearGameActionTimers();
  stopSpeech();
  hero = { lv: 1, hp: 100, maxHp: 100, atk: 35 };
  enemyIndex = 0;
  currentEnemy = null;
  currentQuiz = null;
  quizPool = [...QUIZZES].sort(() => Math.random() - 0.5);
  gameStartedAt = Date.now();
  answeredCount = 0;
  correctCount = 0;
  recordSaved = false;
  heroX = 90;
  enemyX = 420;
  heroShake = 0;
  enemyShake = 0;
  slashEffect = false;
  damageTexts = [];
  isProcessing = true;
  const recordBtn = document.getElementById('record-btn');
  if (recordBtn) recordBtn.style.display = 'none';
  updateUI();
  const overlay = document.getElementById('overlay');
  if (overlay) overlay.style.display = 'none';
  startConversationEvent();
}

function spawnEnemy() {
  if (enemyIndex < 0 || enemyIndex >= ENEMIES.length) {
    showEndGame(true);
    return;
  }
  const eData = ENEMIES[enemyIndex];
  if (!eData) { showEndGame(true); return; }
  currentEnemy = { ...eData };
  setMessage(`${currentEnemy.name} が あらわれた！`);
  updateUI();
  nextQuiz();
}

function nextQuiz() {
  if (!currentEnemy || currentEnemy.hp <= 0) return;
  document.getElementById('hint-box').style.display = 'none';

  if (quizPool.length === 0) {
    quizPool = [...QUIZZES].sort(() => Math.random() - 0.5);
  }
  currentQuiz = quizPool.pop();

  // 問題カードの生成（ルビ付き）
  document.getElementById('quiz-question').innerHTML = currentQuiz.qHtml;

  // 4つの選択肢ボタンの生成（形状バッジ＋ルビ付き）
  const container = document.getElementById('options-container');
  container.innerHTML = '';

  currentQuiz.opts.forEach((opt, idx) => {
    const badge = BADGE_CONFIGS[idx];
    const btn = document.createElement('button');
    btn.className = 'btn-option';
    btn.onclick = () => selectAnswer(idx);
    
    btn.innerHTML = `
      <span class="shape-badge ${badge.class}">${badge.shape}</span>
      <span class="opt-text">${opt.html}</span>
    `;
    container.appendChild(btn);
  });

  isProcessing = false;

  // 自動読み上げ（ONの場合）
  if (autoSpeechEnabled) {
    readQuestionSpeech();
  }
}

function readQuestionSpeech() {
  if (!currentQuiz) return;
  
  let fullSpeech = `問題。${currentQuiz.qSpeech}。`;
  currentQuiz.opts.forEach((opt, idx) => {
    const badge = BADGE_CONFIGS[idx];
    fullSpeech += `${idx + 1}番、${badge.text}、${opt.speech}。`;
  });

  speakText(fullSpeech);
}

function showHint() {
  if (!currentQuiz || isProcessing) return;
  initAudio();
  playSE('hint');

  const hintBox = document.getElementById('hint-box');
  hintBox.style.display = 'block';
  hintBox.innerText = currentQuiz.hintText;

  speakText(currentQuiz.hintSpeech);
}

function selectAnswer(index) {
  if (isProcessing) return;
  if (!currentQuiz || !currentEnemy || currentEnemy.hp <= 0) {
    safeRecoverFromGameError(new Error('game state is not ready'));
    return;
  }
  isProcessing = true;
  answeredCount++;
  stopSpeech();
  initAudio();

  const btns = document.querySelectorAll('.btn-option');
  btns.forEach(function(b){ b.disabled = true; });

  try {
    if (index === currentQuiz.a) {
      correctCount++;
      playSE('correct');
      setMessage(`⭕ 正解（せいかい）！<br>${currentQuiz.expHtml}`);
      speakText(`せいかい！ ${currentQuiz.expSpeech}`);

      scheduleGameAction(function(){
        if(!currentEnemy || currentEnemy.hp <= 0) return;
        playSE('attack');
        heroX += 40;
        slashEffect = true;
        enemyShake = 15;
        const dmg = hero.atk + Math.floor(Math.random() * 8);
        currentEnemy.hp = Math.max(0, currentEnemy.hp - dmg);
        damageTexts.push({ text: `-${dmg}`, x: enemyX + 30, y: enemyY, color: '#ffff00', alpha: 1.0 });
        updateUI();

        scheduleGameAction(function(){
          heroX -= 40;
          slashEffect = false;
          if (currentEnemy.hp <= 0) {
            playSE('fanfare');
            setMessage(`✨ ${currentEnemy.name} を たおした！`);
            speakText(`${currentEnemy.name} を たおしました！`);
            scheduleGameAction(function(){
              enemyIndex++;
              if (enemyIndex >= ENEMIES.length) {
                showEndGame(true);
              } else {
                hero.lv++;
                hero.maxHp += 20;
                hero.hp = hero.maxHp;
                hero.atk += 8;
                setMessage(`🌟 レベルが あがった！ HPが まんたんになった！`);
                speakText('レベルが あがりました！');
                updateUI();
                scheduleGameAction(spawnEnemy, 1200);
              }
            }, 1200);
          } else {
            scheduleGameAction(nextQuiz, 900);
          }
        }, 300);
      }, 1200);

    } else {
      playSE('wrong');
      setMessage('❌ 今回は違うようです。正解はまだ表示しません。選択肢を見比べて、次の問題でも練習しましょう。');
      speakText('今回は違うようです。正解はすぐに表示しません。選択肢を見比べて、次の問題でも練習しましょう。');

      scheduleGameAction(function(){
        if(!currentEnemy) return;
        playSE('attack');
        heroShake = 15;
        const dmg = currentEnemy.atk + Math.floor(Math.random() * 5);
        hero.hp = Math.max(0, hero.hp - dmg);
        damageTexts.push({ text: `-${dmg}`, x: heroX + 20, y: heroY, color: '#ff3333', alpha: 1.0 });
        updateUI();
        if (hero.hp <= 0) {
          scheduleGameAction(function(){ showEndGame(false); }, 700);
        } else {
          scheduleGameAction(nextQuiz, 1000);
        }
      }, 1200);
    }
  } catch(e) {
    safeRecoverFromGameError(e);
  }
}

function setMessage(htmlText) {
  document.getElementById('message-text').innerHTML = htmlText;
}

function updateUI() {
  document.getElementById('hero-lv').innerText = hero.lv;
  document.getElementById('hero-hp').innerText = hero.hp;
  document.getElementById('hero-maxhp').innerText = hero.maxHp;
  
  const hPct = Math.max(0, (hero.hp / hero.maxHp) * 100);
  const hBar = document.getElementById('hero-hp-bar');
  hBar.style.width = hPct + '%';
  hBar.style.backgroundColor = hPct < 30 ? '#ff3333' : hPct < 60 ? '#ffcc00' : '#00ff66';

  if (currentEnemy) {
    document.getElementById('enemy-name').innerText = currentEnemy.name;
    const ePct = Math.max(0, (currentEnemy.hp / currentEnemy.maxHp) * 100);
    document.getElementById('enemy-hp-bar').style.width = ePct + '%';
  }
}


function saveKotobaQuestRecord(isWin) {
  if (recordSaved) return;
  recordSaved = true;
  try {
    const finishedAt = new Date();
    const startedAt = gameStartedAt ? new Date(gameStartedAt) : finishedAt;
    const total = Math.max(0, answeredCount);
    const score = Math.max(0, correctCount);
    const rate = total ? Math.round(score / total * 100) : 0;
    const record = {
      id: String(finishedAt.getTime()) + '-' + Math.random().toString(36).slice(2,8),
      date: finishedAt.getFullYear() + '-' + String(finishedAt.getMonth()+1).padStart(2,'0') + '-' + String(finishedAt.getDate()).padStart(2,'0'),
      time: finishedAt.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),
      startedAt: startedAt.toISOString(),
      finishedAt: finishedAt.toISOString(),
      durationSec: Math.max(0, Math.round((finishedAt-startedAt)/1000)),
      category: 'ことばファンタジーDX',
      genre: 'ことばファンタジーDX',
      activity: isWin ? 'ことばファンタジーDX（ゲームクリア）' : 'ことばファンタジーDX（ゲームオーバー）',
      score: score,
      total: total,
      rate: rate,
      kind: 'kotobaQuest',
      turns: 0,
      result: isWin ? 'clear' : 'gameover'
    };
    const key = 'aphasiaTrainingRecordsV4';
    let records = [];
    try { records = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { records = []; }
    if (!Array.isArray(records)) records = [];
    records.push(record);
    records.sort((a,b)=>new Date(a.finishedAt)-new Date(b.finishedAt));
    localStorage.setItem(key, JSON.stringify(records));
  } catch (e) {
    console.warn('Kotoba Quest record save failed', e);
  }
}

function openKotobaQuestRecords() {
  stopSpeech();
  try {
  } catch (e) {}
  window.location.href = 'index.html#records';
}

function showEndGame(isWin) {
  stopSpeech();
  saveKotobaQuestRecord(isWin);
  const overlay = document.getElementById('overlay');
  const titleText = document.getElementById('overlay-title');
  const descText = document.getElementById('overlay-desc');
  const startBtn = document.getElementById('start-btn');

  overlay.style.display = 'flex';
  if (isWin) {
    playSE('fanfare');
    titleText.innerText = "👑 クリア おめでとう！ 👑";
    titleText.style.color = "#00ffcc";
    descText.innerHTML = "すべての モンスターを たおした！<br>世界（せかい）に 平和（へいわ）が もどった！";
    speakText("クリア おめでとうございます！ すべての モンスターを たおしました！");
  } else {
    titleText.innerText = "ゲームオーバー";
    titleText.style.color = "#ff4d4d";
    descText.innerHTML = "勇者（ゆうしゃ）は たおれてしまった...<br>ゆっくり 休んで もう一度（いちど） 挑戦（ちょうせん）しよう！";
    speakText("ゲームオーバー。ゆっくり 休んで もう一度 挑戦しよう！");
  }
  startBtn.innerText = "もう一度（いちど） 冒険（ぼうけん）する";
  const recordBtn = document.getElementById('record-btn');
  if (recordBtn) recordBtn.style.display = 'inline-block';
}

document.getElementById('btn-back-main').addEventListener('click', returnToKotobaQuest);

  initAudio();
  playSE('click');
  advanceEvent();
});
const eventReplayButton = document.getElementById('eventReplayBtn');
if (eventReplayButton) eventReplayButton.addEventListener('click', (event) => {
  event.stopPropagation();
  initAudio();
  playSE('click');
  const step = EVENT_STEPS[eventIndex];
  if (step) speakText(step.text);
});

  initAudio();
  playSE('click');
  initGame();
});

  initAudio();
  playSE('click');
  readQuestionSpeech();
});

document.getElementById('btn-show-hint').addEventListener('click', () => {
  showHint();
});

document.getElementById('btn-auto-speech').addEventListener('click', function() {
  initAudio();
  playSE('click');
  autoSpeechEnabled = !autoSpeechEnabled;

  if (autoSpeechEnabled) {
    this.classList.add('active');
    this.innerHTML = '🔊 <ruby>自動<rt>じどう</rt></ruby>よみあげ: ON';
  } else {
    this.classList.remove('active');
    this.innerHTML = '🔇 <ruby>自動<rt>じどう</rt></ruby>よみあげ: OFF';
    stopSpeech();
  }
});

// ファイル切り替え時に前のイベント表示が残らないよう、初期状態は必ず非表示。
const initialEventOverlay = document.getElementById('eventOverlay');
if (initialEventOverlay) initialEventOverlay.style.display = 'none';

// レンダリングループ開始
render();
